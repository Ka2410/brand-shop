<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Wishlist — LUX</title>
<meta name="description" content="Your saved LUX pieces." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://lux-eg.com/wishlist.html" />
<meta property="og:title" content="Wishlist — LUX" />
<meta property="og:description" content="Your saved LUX pieces." />
<meta property="og:image" content="https://lux-eg.com/images/look-01.png" />
<meta property="og:site_name" content="LUX" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Wishlist — LUX" />
<meta name="twitter:description" content="Your saved LUX pieces." />
<meta name="twitter:image" content="https://lux-eg.com/images/look-01.png" />
<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@300;400;500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css" />
</head>
<body>

<div id="navbar-container"></div>

<div class="page-header">
  <div class="breadcrumb"><a href="index.html">Home</a> / <span data-t="wishlist">Wishlist</span></div>
  <h1 data-t="myWishlist">My Wishlist</h1>
  <p data-t="wishlistPageText">Your favorite pieces, saved for later.</p>
</div>

<section class="section">
  <div class="container">
    <div id="wishlistContent"></div>
  </div>
</section>

<section class="recently-viewed" id="recentlyViewedSection" style="display:none;">
  <div class="section-head">
    <h2 class="section-title" data-t="recentlyViewed">Recently Viewed</h2>
  </div>
  <div class="product-grid" id="recentlyViewedGrid"></div>
</section>

<div id="footer-container"></div>
<div id="drawers-container"></div>
<div id="modals-container"></div>

<script src="./js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('navbar-container').innerHTML = renderNavbar();
  document.getElementById('footer-container').innerHTML = renderFooter();
  document.getElementById('drawers-container').innerHTML = renderDrawers();
  document.getElementById('modals-container').innerHTML = renderModals();
  initApp();

  function renderWishlist() {
    const container = document.getElementById('wishlistContent');
    const items = PRODUCTS.filter(p => isWishlisted(p.id));

    if (items.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">
            <svg viewBox="0 0 24 24"><path d="M20.8 4.6c-2-2-5.2-2-7.1 0L12 6.3l-1.7-1.7c-1.9-2-5.1-2-7.1 0-2 2-2 5.2 0 7.1L12 20.5l8.8-8.8c2-1.9 2-5.1 0-7.1z"/></svg>
          </div>
          <h2 data-t="emptyWishlist">Your wishlist is empty.</h2>
          <p data-t="emptyWishlistText">Save your favorite pieces for later by tapping the heart icon.</p>
          <a href="shop.html" class="btn" data-t="startShopping">Start Shopping</a>
        </div>
      `;
      applyTranslations();
    } else {
      container.innerHTML = `<div class="product-grid">${items.map(p => productCardHTML(p)).join('')}</div>`;
    }
  }

  function renderRecent() {
    const products = AppState.recentlyViewed.map(id => PRODUCTS.find(p => p.id === id)).filter(Boolean);
    if (products.length < 2) return;
    document.getElementById('recentlyViewedSection').style.display = 'block';
    document.getElementById('recentlyViewedGrid').innerHTML = products.map(p => productCardHTML(p)).join('');
  }

  renderWishlist();
  renderRecent();

  window.onLanguageChange = () => { renderWishlist(); renderRecent(); };
});
</script>
</body>
</html>
