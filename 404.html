<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — LUX</title>
<meta name="description" content="Page not found — LUX. Lost in the streets?" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://lux-eg.com/404.html" />
<meta property="og:title" content="404 — LUX" />
<meta property="og:description" content="Lost in the streets?" />
<meta property="og:image" content="https://lux-eg.com/images/look-01.png" />
<meta property="og:site_name" content="LUX" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="404 — LUX" />
<meta name="twitter:description" content="Lost in the streets?" />
<meta name="twitter:image" content="https://lux-eg.com/images/look-01.png" />
<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@300;400;500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css" />
<link rel="stylesheet" href="./css/animations.css" />
<link rel="stylesheet" href="./css/404.css" />
</head>
<body>

<div id="navbar-container"></div>

<div class="error-page">
  <div class="error-visual">
    <div class="error-num-outline">404</div>
    <div class="error-num">404</div>
  </div>

  <h1 data-t="pageNotFoundTitle">Lost in the streets?</h1>
  <p data-t="pageNotFoundSub">The page you're looking for doesn't exist — but these do.</p>

  <div class="error-actions">
    <a href="index.html" class="btn" data-t="goHome">Go Home</a>
    <a href="shop.html" class="btn btn-ghost" data-t="backToShop">Back to Shop</a>
  </div>

  <div class="error-suggestions">
    <div class="error-suggestions-title" data-t="exploreCollection">Explore Collection</div>
    <div class="product-grid" id="errorSuggestions"></div>
  </div>
</div>

<div id="footer-container"></div>
<div id="drawers-container"></div>
<div id="modals-container"></div>

<script src="./js/app.js"></script>
<script src="./js/animations.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('navbar-container').innerHTML = renderNavbar();
  document.getElementById('footer-container').innerHTML = renderFooter();
  document.getElementById('drawers-container').innerHTML = renderDrawers();
  document.getElementById('modals-container').innerHTML = renderModals();
  initApp();

  const grid = document.getElementById('errorSuggestions');
  const featured = PRODUCTS.slice(0, 3);
  grid.innerHTML = featured.map(p => productCardHTML(p)).join('');

  window.onLanguageChange = () => {
    grid.innerHTML = featured.map(p => productCardHTML(p)).join('');
  };
});
</script>
</body>
</html>
